<title>آموزش سه‌بعدی واحد آبگیر (SWI)</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#12232f;--card:rgba(250,252,253,.96);--ac:#0b7a9e;--mu:#52646f;--chip:#e3eef3;--ln:#c5d6de;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fg:#e6f0f5;--card:rgba(14,28,38,.96);--ac:#5cd0f0;--mu:#9bb0bc;--chip:#1b3342;--ln:#2c4656}}
html,body{height:100%;margin:0;overflow:hidden;background:#0d2230;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--fg)}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{position:absolute;top:env(safe-area-inset-top,0px);inset-inline:0;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
#bar button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
#bar button.on{background:var(--ac);color:#04212c;border-color:var(--ac);font-weight:700}
.hs{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;background:#ffb000;color:#201400;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;cursor:pointer;transform:translate(0,0)}
.hs.on{background:#fff;outline:3px solid #ffb000}
#pn{position:absolute;inset-inline:0;bottom:env(safe-area-inset-bottom,0px);max-height:44vh;overflow:auto;background:var(--card);border-top:2px solid var(--ac);padding:10px 14px 12px;line-height:1.9;font-size:14px;border-radius:14px 14px 0 0}
#pn.min{max-height:46px;overflow:hidden}
h2{margin:0 0 4px;font-size:17px;color:var(--ac);display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 button{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
#tx{margin:0 0 8px;max-width:75ch}
#sp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
#sp span{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px}
.ac{display:flex;gap:6px;flex-wrap:wrap}
.ac button{flex:1;min-width:84px;border:1px solid var(--ac);background:none;color:var(--fg);border-radius:8px;padding:6px;font:inherit;font-size:13px;cursor:pointer}
.ac button.on{background:var(--ac);color:#04212c}
#nt{display:block;color:var(--mu);font-size:11px;margin-top:6px}
button:focus-visible{outline:2px solid #ffb000}
</style></head><body>

const P=new Map();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY])};
cv.onpointerup=cv.onpointercancel=e=>P.delete(e.pointerId);
cv.onpointermove=e=>{const o=P.get(e.pointerId);if(!o)return;if(P.size==1){az-=(e.clientX-o[0])*.008;el=Math.max(.05,Math.min(1.4,el+(e.clientY-o[1])*.006))}else{let q=[...P.entries()].find(k=>k[0]!=e.pointerId)[1];const a=Math.hypot(o[0]-q[0],o[1]-q[1]),b=Math.hypot(e.clientX-q[0],e.clientY-q[1]);if(b>0){gd=Math.max(8,Math.min(160,gd*a/b));dist=gd}}P.set(e.pointerId,[e.clientX,e.clientY])};
cv.onwheel=e=>{e.preventDefault();gd=Math.max(8,Math.min(160,gd*(1+e.deltaY*.001)))};

 ps.forEach(p=>{const len=p.L[p.L.length-1];p.s=(p.s+.09)%len;let k=1;while(k<p.L.length-1&&p.L[k]<p.s)k++;const f=(p.s-p.L[k-1])/(p.L[k]-p.L[k-1]);p.m.position.lerpVectors(p.v[k-1],p.v[k],f)});
 const w=innerWidth,h=innerHeight;S.forEach((s,i)=>{vv.set(s.g[0],s.g[1]+(i?3.5:12),s.g[2]).project(cam);const e=hs[i].style;if(vv.z>1){e.display='none'}else{e.display='flex';e.left=((vv.x*.5+.5)*w)+'px';e.top=((-vv.y*.5+.5)*h)+'px'}});
 R.render(sc,cam);requestAnimationFrame(loop)}
go(0);cur.copy(goal);loop();
